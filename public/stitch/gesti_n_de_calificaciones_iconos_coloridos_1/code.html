<script>
        function toggleModal(id) {
            const modal = document.getElementById(id);
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        function selectInstrument(type) {
            const cards = document.querySelectorAll('.instrument-card');
            cards.forEach(card => card.classList.add('opacity-60'));
            
            const selectedCard = document.getElementById('btn-' + type);
            selectedCard.classList.remove('opacity-60');
            
            // Interaction logic could go here to swap table headers/logic
            console.log('Instrumento seleccionado:', type);
        }

        // Simple validation visualization
        document.querySelectorAll('.grade-input').forEach(input => {
            input.addEventListener('change', (e) => {
                const val = parseFloat(e.target.value);
                if (val < 10.5) {
                    e.target.classList.add('text-secondary');
                } else {
                    e.target.classList.remove('text-secondary');
                }
            });
        });

        // Close modal on escape
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('modal-config').classList.add('hidden');
                document.getElementById('modal-config').classList.remove('flex');
            }
        });
    </script>
